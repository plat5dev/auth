# Optional override: build issuer from this repo instead of pulling GHCR.
# docker compose -f docker-compose.prod.yml -f docker-compose.prod.build.yml --env-file .env up --build -d
services:
  issuer:
    build:
      context: ../issuer
      target: prod
      args:
        VERSION: ${AUTH_VERSION:-v0.2.1}
        REVISION: ${AUTH_REVISION:-}
