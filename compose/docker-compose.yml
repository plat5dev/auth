name: auth

volumes:
  pg_data:

networks:
  auth:
    driver: bridge

services:
  postgres:
    image: postgres:17
    labels:
      service.name: postgres
      service.namespace: auth
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-auth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-auth}
      POSTGRES_DB: ${POSTGRES_DB:-auth}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - auth
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  issuer:
    build:
      context: ../issuer
      target: local
    labels:
      service.name: issuer
      service.namespace: auth
    ports:
      - "5401:5000"
    environment:
      DATABASE_URL: postgres://auth:auth@postgres:5432/auth?sslmode=disable
      INTERNAL_PORT: 5001
      AUTH_ALLOWED_CLIENTS: ${AUTH_ALLOWED_CLIENTS:-plat5}
      AUTH_ALLOWED_REDIRECT_URIS: ${AUTH_ALLOWED_REDIRECT_URIS:-http://localhost:5173/callback}
      AUTH_DISPLAY_NAME: ${AUTH_DISPLAY_NAME:-Plat5}
      AUTH_THEME_FILE: ${AUTH_THEME_FILE:-}
      OTEL_SERVICE_NAME: issuer
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=auth,deployment.environment=docker
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # Dev-only: POST /dev/token mint + login codes logged without SMTP
      # (anyone can sign in as anyone). Never set in prod.
      AUTH_DEV_MODE: "true"
      # Dev-only: a password login that works without reading codes from the logs.
      AUTH_DEV_USERS: ${AUTH_DEV_USERS:-dev@example.com:password}
    volumes:
      - ../issuer:/app
      - /app/node_modules
    networks:
      - auth
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:5001/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
