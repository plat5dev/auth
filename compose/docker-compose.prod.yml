# Production stack — pulls ghcr.io/plat5dev/auth:${AUTH_VERSION}.
# Pin: AUTH_VERSION (tag from this repo's v* releases, e.g. v0.3.0).
# Build locally: add -f docker-compose.prod.build.yml and --build.
name: auth

volumes:
  pg_data:

networks:
  auth:
    driver: bridge

services:
  postgres:
    image: postgres:17
    labels:
      service.name: postgres
      service.namespace: auth
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-auth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-auth}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - auth
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  issuer:
    image: ghcr.io/plat5dev/auth:${AUTH_VERSION:-v0.3.0}
    labels:
      service.name: issuer
      service.namespace: auth
    ports:
      # Loopback by default; terminate TLS in a reverse proxy on the host.
      - "${AUTH_BIND_ADDR:-127.0.0.1}:5000:5000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-auth}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-auth}?sslmode=disable
      INTERNAL_PORT: 5001
      # BYO SMTP — any host-published MTA or provider (Resend, SES, …). Not bundled.
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:?SMTP_USER is required}
      SMTP_PASS: ${SMTP_PASS:?SMTP_PASS is required}
      SMTP_FROM: ${SMTP_FROM:-noreply@plat5.test}
      SMTP_TLS_INSECURE: ${SMTP_TLS_INSECURE:-false}
      PUBLIC_ISSUER_URL: ${PUBLIC_ISSUER_URL:?PUBLIC_ISSUER_URL is required}
      AUTH_ALLOWED_CLIENTS: ${AUTH_ALLOWED_CLIENTS:-plat5}
      AUTH_ALLOWED_REDIRECT_URIS: ${AUTH_ALLOWED_REDIRECT_URIS:?AUTH_ALLOWED_REDIRECT_URIS is required}
      AUTH_ALLOWED_AUDIENCES: ${AUTH_ALLOWED_AUDIENCES:-}
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:-}
      AUTH_TOKEN_EMAIL: ${AUTH_TOKEN_EMAIL:-}
      AUTH_DISPLAY_NAME: ${AUTH_DISPLAY_NAME:-Plat5}
      AUTH_THEME_FILE: ${AUTH_THEME_FILE:-}
      OTEL_SERVICE_NAME: issuer
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=auth,deployment.environment=prod
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-}
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-}
      OTEL_TRACES_SAMPLER_RATIO: ${OTEL_TRACES_SAMPLER_RATIO:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - auth
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:5001/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
